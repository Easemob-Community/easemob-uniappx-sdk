// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    apply from: "${rootDir}/config.gradle"

    dependencies {
        classpath(files('plugins/uts-kotlin-compiler-plugin-0.0.1.jar'))
        classpath(files('plugins/uts-kotlin-gradle-plugin-0.0.1.jar'))
        classpath "com.android.tools.build:gradle:${libs.versions.agp.get()}"
        // 项目插件
        projectDependencies.forEach { String dep ->
            classpath dep
        }
    }
}
plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.jetbrains.kotlin.android) apply false
    alias(libs.plugins.android.library) apply false
}
subprojects {
    project.layout.buildDirectory.set(new File(rootDir, "gradle-build/${path.replaceAll(':', '/')}"))
}