apply from: "${rootDir}/config.gradle"

def isApp = project.name == "app"
def requiredDeps = [libs.androidx.core.ktx,
                    libs.androidx.lifecycle.runtime.ktx,
                    "androidx.recyclerview:recyclerview:1.3.2",
                    libs.androidx.appcompat,
                    "androidx.exifinterface:exifinterface:1.3.6",
                    "androidx.localbroadcastmanager:localbroadcastmanager:1.0.0",
                    "androidx.constraintlayout:constraintlayout:2.1.4",
                    libs.material,
                    "androidx.viewpager2:viewpager2:1.1.0-beta02",
                    "androidx.webkit:webkit:1.6.0",
                    "com.alibaba:fastjson:1.2.83",
                    "com.facebook.fresco:fresco:3.6.0",
                    "com.facebook.fresco:middleware:3.6.0",
                    "com.facebook.fresco:animated-gif:3.6.0",
                    "com.facebook.fresco:webpsupport:3.6.0",
                    "com.facebook.fresco:animated-webp:3.6.0",
                    "com.github.bumptech.glide:glide:4.9.0",
                    "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3",
                    "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3",
                    "org.jetbrains.kotlin:kotlin-stdlib:${libs.versions.kotlin.get()}",
                    "org.jetbrains.kotlin:kotlin-reflect:${libs.versions.kotlin.get()}",
                    "org.jetbrains.kotlinx:kotlinx-serialization-json:1.5.1",
                    "com.squareup.okhttp3:okhttp:3.12.12",
                    "com.github.getActivity:XXPermissions:18.63",
                    "net.lingala.zip4j:zip4j:2.11.5"]

dependencies {
    // 必须的依赖
    requiredDeps.forEach {
        def library = it
        if (isApp) {
            implementation library
        } else {
            compileOnly library
        }
    }
    //插件依赖
    def dependencies = getUniXDependencies()
    if (dependencies != null) {
        dependencies.each { dep ->
            if (dep instanceof String) {
                if (isApp) {
                    implementation dep
                } else {
                    compileOnly dep
                }
            } else if (dep instanceof Map) {
                if (dep.source) {
                    def sourceStr = dep.source.toString()
                    // 使用更宽松的正则表达式
                    def matcher = sourceStr =~ /'([^']+)'/
                    if (matcher.find()) {
                        def coordinates = matcher.group(1)  // 获取依赖坐标
//                        println("coordinates=$coordinates")
                        // 提取 exclude 信息
                        def excludeMatcher = sourceStr =~ /exclude group:\s*'([^']+)',\s*module:\s*'([^']+)'/
                        def excludeMatcher1 = sourceStr =~ /exclude group:\s*'([^']+)'/
                        if (excludeMatcher.find()) {
                            def groupName = excludeMatcher.group(1)
                            def moduleName = excludeMatcher.group(2)
                            if (isApp) {
                                implementation(coordinates) {
                                    exclude group: groupName, module: moduleName
                                }
                            } else {
                                compileOnly(coordinates) {
                                    exclude group: groupName, module: moduleName
                                }
                            }
                        } else if (excludeMatcher1.find()) {
                            def groupName = excludeMatcher1.group(1)
                            if (isApp) {
                                implementation(coordinates) {
                                    exclude group: groupName
                                }
                            } else {
                                compileOnly(coordinates) {
                                    exclude group: groupName
                                }
                            }
                        } else {
                            if (isApp) {
                                implementation coordinates
                            } else {
                                compileOnly coordinates
                            }
                        }
                    } else {
                        println("find fail")
                    }
                }
            }
        }
    }

}
