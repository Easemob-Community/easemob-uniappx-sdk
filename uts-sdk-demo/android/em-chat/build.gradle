plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.jetbrains.kotlin.android)
    id 'io.dcloud.uts.kotlin'
}

apply from: "${rootDir}/unix.gradle"
apply from: "${rootDir}/module.gradle"
apply from: "module.gradle"

android {
    namespace 'io.dcloud.nativeresouce'
    compileSdk 34

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
    }

}

dependencies {
    compileOnly fileTree(include: ['*.aar', '*.jar'], dir: "${rootDir}/uniappx/libs")
    compileOnly fileTree(include: ['*.aar', '*.jar'], dir: "${rootDir}/pluginsLibs")
}