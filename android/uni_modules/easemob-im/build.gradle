plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'io.dcloud.uts.kotlin'  // UTS Kotlin 编译插件
}

android {
    namespace 'uni_modules.easemob_im'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 33
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    // UniApp 核心库（compileOnly 避免重复打包）
    compileOnly fileTree(include: ['*.aar'], dir: '../../app/libs')
    
    // AndroidX
    compileOnly 'androidx.core:core-ktx:1.12.0'
    compileOnly 'androidx.appcompat:appcompat:1.6.1'
    
    // Kotlin 协程
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    
    // 环信 SDK
    implementation 'io.hyphenate:hyphenate-chat:4.15.1'
}
