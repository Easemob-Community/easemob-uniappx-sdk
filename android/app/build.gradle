plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.easemob.uniappx'
    
    // HBuilderX 4.81+ 要求 compileSdk 36 适配 16KB
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.easemob.uniappx"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
        
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    // UniApp 配置
    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
    }
    
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    // UniApp 基础库（从离线 SDK 获取）
    def sdkLibsDir = file('../SDK/libs')
    if (sdkLibsDir.exists()) {
        implementation fileTree(dir: '../SDK/libs', include: ['*.aar'])
    } else {
        println "警告: 未找到 SDK 目录 ../SDK/libs，请下载 UniApp 离线 SDK"
    }
    
    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // Kotlin 协程
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation 'com.alibaba:fastjson:1.2.83'
    
    // 环信 SDK
    implementation 'io.hyphenate:hyphenate-chat:4.15.1'
    
    // UTS 插件支持
    implementation fileTree(dir: '../SDK/libs', include: ['utsplugin-release.aar'])
    
    // UTS 插件模块
    implementation project(':uni_modules:easemob-im')
}
